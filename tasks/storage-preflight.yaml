---
- name: Validate selected storage settings
  ansible.builtin.import_tasks: storage-settings.yaml

- name: Read current StorageClasses
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig=/etc/kubernetes/admin.conf, get, storageclasses, --output=json]
  register: storage_classes
  changed_when: false
  check_mode: false

- name: Prevent replacing a different default StorageClass
  ansible.builtin.assert:
    that:
      - (item.metadata.annotations | default({})).get('storageclass.kubernetes.io/is-default-class', 'false') != 'true' or item.metadata.name == k8s_default_storage_class
      - (item.metadata.annotations | default({})).get('storageclass.beta.kubernetes.io/is-default-class', 'false') != 'true' or item.metadata.name == k8s_default_storage_class
    fail_msg: A different default StorageClass exists. Review it explicitly before selecting a new default.
  loop: "{{ (storage_classes.stdout | from_json)['items'] }}"
  when: k8s_default_storage_class | length > 0

- name: Initialize Ceph state for following host checks
  ansible.builtin.set_fact:
    rook_existing_cluster: false
    rook_csi_previous_key_policy: {}
    rook_csi_current_key_generation: 0
    rook_csi_current_key_type: ''
    rook_csi_current_core_key_types: {}

- name: Inspect existing Rook cluster without modifying it
  when: "'rook' in k8s_csi_providers"
  block:
    - name: Read the existing RBD node plugin image
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig=/etc/kubernetes/admin.conf, --namespace, "{{ rook_namespace }}", get, daemonset, "{{ rook_namespace }}.rbd.csi.ceph.com-nodeplugin", --ignore-not-found, --output=json]
      register: rook_csi_before
      changed_when: false
      check_mode: false

    - name: Prevent unacknowledged CSI image replacement
      ansible.builtin.assert:
        that:
          - rook_allow_csi_image_change or rook_desired_csi_image in ((rook_csi_before.stdout | from_json).spec.template.spec.containers | selectattr('name', 'equalto', 'csi-rbdplugin') | map(attribute='image') | list)
        fail_msg: Existing RBD CSI image differs. Review the upstream storage upgrade procedure and explicitly set rook_allow_csi_image_change=true before replacing it.
      vars:
        rook_desired_csi_image: "quay.io/cephcsi/cephcsi:{{ rook_csi_version }}@sha256:{{ rook_csi_image_digests[rook_csi_version] }}"
      when: rook_csi_before.stdout | length > 0

    - name: Check CephCluster API presence
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig=/etc/kubernetes/admin.conf, get, crd, cephclusters.ceph.rook.io, --ignore-not-found, --output=json]
      register: rook_crd
      changed_when: false
      check_mode: false

    - name: Read existing CephCluster
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig=/etc/kubernetes/admin.conf, --namespace, "{{ rook_namespace }}", get, cephcluster, "{{ rook_namespace }}", --ignore-not-found, --output=json]
      register: rook_cluster_before
      changed_when: false
      check_mode: false
      when: rook_crd.stdout | length > 0

    - name: Record existing Ceph cluster status
      ansible.builtin.set_fact:
        rook_existing_cluster: "{{ rook_cluster_before.stdout | default('') | length > 0 }}"

    - name: Prevent implicit Ceph disk or image reconfiguration
      ansible.builtin.assert:
        that:
          - (rook_cluster_before.stdout | from_json).spec.storage.nodes == (lookup('template', playbook_dir + '/../roles/storage/csi-rook/templates/ceph-cluster.yaml.j2') | from_yaml).spec.storage.nodes
          - (rook_cluster_before.stdout | from_json).spec.cephVersion.image == rook_ceph_image
          - (rook_cluster_before.stdout | from_json).spec.dataDirHostPath == rook_data_dir
        fail_msg: Existing Ceph devices or image differ. Use a separate reviewed Ceph maintenance procedure.
      when: rook_existing_cluster

    - name: Record CSI key policy metadata without reading key values
      ansible.builtin.set_fact:
        rook_csi_previous_key_policy: "{{ rook_csi_spec_policy }}"
        rook_csi_current_key_generation: "{{ [rook_csi_spec_policy.get('keyGeneration', 0) | int, rook_csi_status_policy.get('keyGeneration', 0) | int] | max }}"
        rook_csi_current_key_type: "{{ rook_csi_status_policy.get('keyType', '') or rook_csi_spec_policy.get('keyType', '') }}"
        rook_csi_current_core_key_types:
          mgr: "{{ (rook_cluster_before.stdout | from_json).get('status', {}).get('cephx', {}).get('mgr', {}).get('keyType', '') }}"
          osd: "{{ (rook_cluster_before.stdout | from_json).get('status', {}).get('cephx', {}).get('osd', {}).get('keyType', '') }}"
      vars:
        rook_csi_spec_policy: "{{ (rook_cluster_before.stdout | from_json).spec.get('security', {}).get('cephx', {}).get('csi', {}) }}"
        rook_csi_status_policy: "{{ (rook_cluster_before.stdout | from_json).get('status', {}).get('cephx', {}).get('csi', {}) }}"
      when: rook_existing_cluster

- name: Require an explicit CSI key type for a new Ceph cluster
  ansible.builtin.assert:
    that: rook_existing_cluster or rook_csi_cephx_key_type | length > 0
    fail_msg: Choose CSI key type aes for older kernels, or aes256k for verified Linux 7.0+ support. Existing cluster key policies are preserved unless an explicit reviewed rotation is requested.
  when: "'rook' in k8s_csi_providers"

- name: Preserve existing CSI key policy or prepare the explicit requested policy
  ansible.builtin.set_fact:
    rook_csi_effective_key_policy: "{{ {'keyRotationPolicy': 'KeyGeneration', 'keyGeneration': rook_csi_cephx_key_generation | int, 'keepPriorKeyCountMax': 2, 'keyType': rook_csi_cephx_key_type} if rook_csi_cephx_key_type | length > 0 else rook_csi_previous_key_policy }}"
  when: "'rook' in k8s_csi_providers"

- name: Prevent implicit CSI key rotation or generation rollback
  ansible.builtin.assert:
    that:
      - rook_csi_effective_key_policy == rook_csi_previous_key_policy or rook_allow_csi_key_rotation
      - rook_csi_cephx_key_generation | int >= rook_csi_current_key_generation | int
      - rook_csi_cephx_key_type == rook_csi_current_key_type or rook_csi_cephx_key_generation | int > rook_csi_current_key_generation | int
      - rook_csi_cephx_key_type != 'aes' or (rook_csi_current_core_key_types.get('mgr') == 'aes256k' and rook_csi_current_core_key_types.get('osd') == 'aes256k')
    fail_msg: Existing CSI key policy differs. Review the client and kernel compatibility, retain prior keys, select a higher explicit generation for key type changes, and acknowledge rook_allow_csi_key_rotation before applying.
  when: "'rook' in k8s_csi_providers and rook_existing_cluster and rook_csi_cephx_key_type | length > 0"
