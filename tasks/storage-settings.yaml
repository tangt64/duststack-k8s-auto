---
- name: Preserve inventory overrides while loading newly added defaults
  ansible.builtin.import_tasks: storage-defaults.yaml

- name: Validate storage configuration before changing hosts
  ansible.builtin.assert:
    that:
      - k8s_csi_providers is sequence and k8s_csi_providers is not string
      - k8s_csi_providers | difference(['nfs', 'rook']) | length == 0
      - k8s_csi_providers | unique | length == k8s_csi_providers | length
      - k8s_default_storage_class in ['', nfs_storage_class, rook_storage_class]
      - k8s_default_storage_class != nfs_storage_class or 'nfs' in k8s_csi_providers
      - k8s_default_storage_class != rook_storage_class or 'rook' in k8s_csi_providers
      - nfs_storage_class != rook_storage_class
      - "'nfs' not in k8s_csi_providers or nfs_server | length > 0"
      - "'nfs' not in k8s_csi_providers or nfs_share is match('^/[^\n]*$')"
      - "'rook' not in k8s_csi_providers or rook_confirm_devices"
      - "'rook' not in k8s_csi_providers or rook_data_dir is match('^/var/lib/rook(?:-[A-Za-z0-9_-]+)?$')"
      - "'rook' not in k8s_csi_providers or groups.get('k8s_storage_ceph', []) | length >= 3"
      - "'rook' not in k8s_csi_providers or groups.get('k8s_storage_ceph', []) | difference(groups.get('k8s_node', [])) | length == 0"
      - rook_replicas | int == 3
      - rook_csi_legacy_lab is boolean
      - rook_allow_csi_image_change is boolean
      - rook_csi_cephx_key_type in ['', 'aes', 'aes256k']
      - rook_csi_cephx_key_generation | int >= 1
      - rook_allow_csi_key_rotation is boolean
      - rook_csi_kernel_aes256k_verified is boolean
      - not rook_csi_legacy_lab or rook_csi_cephx_key_type in ['', 'aes']
      - rook_csi_version == ('v3.16.3' if rook_csi_legacy_lab else 'v3.18.1')
      - "'rook' not in k8s_csi_providers or k8s_version.split('.')[1] | int <= 36"
    fail_msg: >-
      Configure an existing NFS export or at least three Ceph workers with
      dedicated empty disks. Acknowledge rook_confirm_devices and choose only
      one default StorageClass. Select a reviewed CSI/Kubernetes profile and
      explicit client key type; see docs/CNI-CSI.md for CPU and key compatibility.
