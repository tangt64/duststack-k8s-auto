---
- name: Explicitly reset Kubernetes nodes
  hosts: k8s_master:k8s_node
  any_errors_fatal: true
  pre_tasks:
    - name: Require explicit acknowledgement of data loss
      ansible.builtin.assert:
        that: k8s_confirm_reset | default(false) | bool
        fail_msg: Reset deletes local cluster state. Supply -e k8s_confirm_reset=true only after backup and drain.
  tasks:
    - name: Reset kubeadm using the configured runtime
      ansible.builtin.command:
        argv: [kubeadm, reset, --force, --cri-socket, "{{ k8s_cri_socket }}"]
      changed_when: true

    - name: Remove local Kubernetes credentials and CNI configuration
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/kubernetes
        - /root/.kube/config
        - /etc/cni/net.d
    # kubeadm does not flush iptables/IPVS rules or remove runtime workloads.
    # See README before reusing a host or changing its CNI.
