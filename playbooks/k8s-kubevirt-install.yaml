---
- name: Guard legacy KubeVirt installer
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tasks:
    - name: Stop before applying obsolete bundled KubeVirt resources
      ansible.builtin.fail:
        msg: Legacy KubeVirt assets are not validated for current Kubernetes. Follow docs/REVIEW.md before enabling a maintained KubeVirt release.
