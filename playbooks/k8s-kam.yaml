---
- name: Install explicitly selected namespace KAM controller
  hosts: k8s_master[0]
  any_errors_fatal: true
  tasks:
    - name: Require a reviewed namespace and explicit administrative installation
      ansible.builtin.assert:
        that:
          - kam_confirm_admin | default(false) | bool
          - kam_namespace | default('') is match('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$')
          - kam_namespace | default('') not in ['default', 'kube-system', 'kam-system']
          - not (kam_namespace | default('')).startswith('kube-')
        fail_msg: Set kam_namespace and kam_confirm_admin=true after reviewing the scoped RBAC and protected kam-system namespace.

    - name: Prepare independently pinned KAM source on the controller
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", "{{ playbook_dir }}/../scripts/prepare_kam_source.py"]
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false

    - name: Verify pre-existing protected and target namespaces
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig=/etc/kubernetes/admin.conf, get, namespace, kam-system, "{{ kam_namespace }}"]
      changed_when: false
      check_mode: false

    - name: Render namespace installation on the controller
      ansible.builtin.command:
        argv: "{{ [ansible_playbook_python, playbook_dir + '/../addons/kam/render.py', '--namespace', kam_namespace] + (['--image', kam_image] if kam_image is defined else []) }}"
      delegate_to: localhost
      become: false
      register: kam_manifest
      changed_when: false
      check_mode: false

    - name: Validate manifests against the actual API before mutation
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig=/etc/kubernetes/admin.conf, apply, --server-side, --dry-run=server, -f, '-']
        stdin: "{{ kam_manifest.stdout }}"
      changed_when: false
      when: not ansible_check_mode

    - name: Compare desired resources without changing the cluster
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig=/etc/kubernetes/admin.conf, diff, --server-side, -f, '-']
        stdin: "{{ kam_manifest.stdout }}"
      register: kam_diff
      changed_when: false
      failed_when: kam_diff.rc not in [0, 1]
      when: not ansible_check_mode

    - name: Apply reviewed namespace controller and CRD
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig=/etc/kubernetes/admin.conf, apply, --server-side, -f, '-']
        stdin: "{{ kam_manifest.stdout }}"
      register: kam_applied
      changed_when: true
      when: not ansible_check_mode and kam_diff.rc == 1

    - name: Wait for CRD registration
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig=/etc/kubernetes/admin.conf, wait, --for=condition=Established, crd/kamaccessgrants.access.kam.dustbox.kr, --timeout=60s]
      changed_when: false
      when: not ansible_check_mode

    - name: Wait for this namespace controller rollout
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig=/etc/kubernetes/admin.conf, -n, kam-system, rollout, status, "deployment/kam-{{ (kam_namespace | hash('sha256'))[:16] }}", --timeout=180s]
      changed_when: false
      when: not ansible_check_mode
