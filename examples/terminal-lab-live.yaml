---
# Merge into a private inventory for a NEW dedicated lab only.
# Add the NFS host to k8s_lab_nfs and three workers to k8s_storage_ceph.
# Set the server address and verify every rook_devices entry before acknowledging.
k8s_csi_providers: [nfs, rook]
k8s_version: '1.36.6'
crio_version: '1.36.7'
# Rocky 9 kernel mounts need AES CSI client keys; core Ceph keeps AES256K.
rook_csi_cephx_key_type: aes
# x86-64-v2 labs need profiles/rook-csi-legacy-lab.yaml; this is experimental.
k8s_default_storage_class: nfs-csi
nfs_server: ''
nfs_share: /srv/duststack-e2e
terminal_lab_nfs_root: /srv/duststack-e2e
terminal_lab_confirm_dedicated: false
rook_confirm_devices: false
