---
- name: Create add-on manifest directory
  ansible.builtin.file:
    path: /etc/kubernetes/addons
    state: directory
    mode: '0755'

- name: Render versioned Flannel manifest
  ansible.builtin.template:
    src: flanned-config.yaml
    dest: /etc/kubernetes/addons/flannel.yaml
    mode: '0644'

- name: Apply Flannel
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig=/etc/kubernetes/admin.conf, apply, -f, /etc/kubernetes/addons/flannel.yaml]
  register: flannel_apply
  changed_when: "'unchanged' not in flannel_apply.stdout"
  when: not ansible_check_mode
