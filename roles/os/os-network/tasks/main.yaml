- dnf:
    name: epel-release
    state: present

- name: install systemd-networkd for networking
  package:
    name: systemd-networkd
    state: present

- name: start to systemd-networkd service
  systemd:
    name: systemd-networkd
    state: started
    enabled: true

- name: add the kubernetes internal interface to firewalld
  firewalld:
    interface: "{{ k8s_interface }}"
    permanent: yes
    state: enabled
    zone: public
  when: use_firewalld

- name: set to a hostname
  hostname:
    name: "{{ nodename }}"

- name: deactive and active to the kubernetes internal interface {{ inventory_hostname }}
  systemd:
    name: systemd-networkd
    state: reloaded
