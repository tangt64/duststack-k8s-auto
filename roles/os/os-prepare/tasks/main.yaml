---
- name: Prepare synchronized clocks before Kubernetes and Ceph bootstrap
  ansible.builtin.import_tasks: ntp.yaml

- name: Set inventory hostname
  ansible.builtin.hostname:
    name: "{{ nodename }}"

- name: Add cluster host records without replacing existing entries
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: '# {mark} ANSIBLE KUBERNETES HOSTS'
    block: |
      {% for host in groups['k8s_master'] | union(groups.get('k8s_node', [])) %}
      {{ hostvars[host]['k8s_ip4'].split('/')[0] }} {{ hostvars[host]['nodename'] }}
      {% endfor %}
