- name: copy dashboard materials on master 
  copy:
    src: "{{ item }}"
    dest: /tmp/
  with_items:
    - dashboard.yaml
    - dashboard-rbac.yaml
    - dashboard-read-only.yaml

- name: enable kubernetes dashboard
  shell: |
    /usr/local/bin/helm repo add kubernetes-dashboard https://kubernetes.github.io/dashboard/
    /usr/local/bin/helm upgrade --install kubernetes-dashboard kubernetes-dashboard/kubernetes-dashboard --create-namespace --namespace kubernetes-dashboard
