---
- name: Keep legacy KubeVirt resource deployment disabled
  ansible.builtin.assert:
    that: not (enabled_virtual | default(false) | bool)
    fail_msg: This role now installs virtctl only. Validate the KubeVirt server version separately; see docs/TOOLS.md.

- name: Install virtctl from a verified external artifact
  ansible.builtin.include_role:
    name: common/cli-tool
  vars:
    cli_tool_name: virtctl
