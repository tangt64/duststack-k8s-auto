---
- name: Install keepalived and health check utility
  ansible.builtin.dnf:
    name: [keepalived, curl]
    state: present

- name: Configure root-owned API health check
  ansible.builtin.copy:
    dest: /etc/keepalived/check-kube-apiserver.sh
    owner: root
    group: root
    mode: '0700'
    content: |
      #!/bin/sh
      {% if k8s_proxy_mode == 'haproxy_keepalived' %}
      /usr/bin/systemctl is-active --quiet haproxy || exit 1
      exec /usr/bin/curl --fail --silent --max-time 2 http://127.0.0.1:8404/health
      {% else %}
      exec /usr/bin/curl --fail --silent --max-time 2 --cacert /etc/kubernetes/pki/ca.crt https://{{ k8s_ip4.split('/')[0] }}:{{ k8s_endpoint_port }}/readyz
      {% endif %}
  notify: Reload keepalived

- name: Validate redundant LB identity and priorities
  ansible.builtin.assert:
    that:
      - keepalived_pri | int >= 1 and keepalived_pri | int <= 254
      - keepalived_node | lower in ['master', 'backup']
      - k8s_vip_address != k8s_ip4.split('/')[0]
      - k8s_vrrp_router_id | default(51) | int >= 1 and k8s_vrrp_router_id | default(51) | int <= 255
      - groups['lb'] | map('extract', hostvars, 'keepalived_pri') | map('int') | unique | length == groups['lb'] | length
  when: k8s_proxy_mode == 'haproxy_keepalived'

- name: Validate VIP is on the LB network and does not reuse any node IP
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['python']['executable'] }}"
      - -c
      - |
        import ipaddress, sys
        vip = ipaddress.ip_address(sys.argv[1])
        nic = ipaddress.ip_interface(sys.argv[2])
        nodes = [ipaddress.ip_interface(x).ip for x in sys.argv[3].split(',')]
        assert vip in nic.network, 'VIP is outside the LB network'
        assert vip not in (nic.network.network_address, nic.network.broadcast_address), 'VIP is not a host address'
        assert vip not in nodes, 'VIP duplicates a node IP'
      - "{{ k8s_vip_address }}"
      - "{{ k8s_ip4 }}"
      - "{{ (groups['lb'] + groups['k8s_master'] + groups.get('k8s_node', [])) | map('extract', hostvars, 'k8s_ip4') | join(',') }}"
  changed_when: false
  check_mode: false
  when: k8s_proxy_mode == 'haproxy_keepalived'

- name: Configure virtual API address
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0600'
    validate: /usr/sbin/keepalived --config-test --use-file=%s
  notify: Reload keepalived

- name: Enable and start keepalived
  ansible.builtin.systemd_service:
    name: keepalived
    enabled: true
    state: started

- name: Apply virtual IP configuration before bootstrap
  ansible.builtin.meta: flush_handlers
