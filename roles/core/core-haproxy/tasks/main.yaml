- name: install haproxy and keepalived
  package:
    name: "{{ item }}"
    state: latest
  loop:
    - haproxy

- name: configuration to haproxy as loadbalance
  template:
    src: haproxy.conf.j2
    dest: /etc/haproxy/haproxy.cfg

- name: start and enable haproxy and keepalived service
  service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - haproxy
- import_tasks: selinux.yaml
