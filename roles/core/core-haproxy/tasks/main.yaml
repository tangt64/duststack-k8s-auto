---
- name: Install HAProxy
  ansible.builtin.dnf:
    name: haproxy
    state: present

- name: Inspect previously installed API trust anchor
  ansible.builtin.stat:
    path: /etc/haproxy/kubernetes-ca.crt
  register: lb_trust_anchor

- name: Keep readiness checks enabled on subsequent runs
  ansible.builtin.set_fact:
    k8s_lb_ready_checks: "{{ lb_trust_anchor.stat.exists }}"

- name: Validate and configure TCP API load balancing
  ansible.builtin.template:
    src: haproxy.conf.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: '0644'
    validate: /usr/sbin/haproxy -c -f %s
  notify: Reload HAProxy

- name: Allow HAProxy connections under SELinux
  ansible.posix.seboolean:
    name: haproxy_connect_any
    state: true
    persistent: true
  when: ansible_facts['selinux']['status'] == 'enabled'

- name: Enable and start HAProxy
  ansible.builtin.systemd_service:
    name: haproxy
    enabled: true
    state: started

- name: Apply API load balancer configuration before bootstrap
  ansible.builtin.meta: flush_handlers
