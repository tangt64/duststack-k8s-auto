---
- name: Join additional control plane
  ansible.builtin.include_role:
    name: kubernetes/k8s-join
  vars:
    k8s_join_control_plane: true

- name: Configure control plane kubeconfig
  ansible.builtin.include_tasks: "{{ role_path }}/../k8s-master-single/tasks/kubeconfig.yaml"
  when: not ansible_check_mode
