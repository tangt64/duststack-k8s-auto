---
- name: Update unrelated OS packages only when requested
  ansible.builtin.dnf:
    name: '*'
    state: latest
    exclude: ['kernel*', 'kube*', 'cri-o*', 'containerd*']
  when: update_all_packages

- name: Install host prerequisites
  ansible.builtin.dnf:
    name: [iproute-tc, conntrack-tools, socat, container-selinux, policycoreutils-python-utils]
    state: present

- name: Install pinned Kubernetes packages without removing existing packages
  ansible.builtin.dnf:
    name: "{{ k8s_core_packages }}"
    state: present
    disable_excludes: kubernetes
