---
- name: Configure SELinux policy
  ansible.posix.selinux:
    policy: targeted
    state: "{{ k8s_selinux_state }}"
  register: k8s_selinux

- name: Require reboot when SELinux mode cannot be applied live
  ansible.builtin.assert:
    that: not k8s_selinux.reboot_required
    fail_msg: SELinux requires a reboot. Reboot and rerun installation.

- name: Create Kubernetes directories with traversable permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/kubernetes
    - /etc/kubernetes/manifests
    - /var/log/kubernetes/audit

- name: Install stable audit policy
  ansible.builtin.copy:
    src: audit-policy.yaml
    dest: /etc/kubernetes/audit-policy.yaml
    owner: root
    group: root
    mode: '0600'
