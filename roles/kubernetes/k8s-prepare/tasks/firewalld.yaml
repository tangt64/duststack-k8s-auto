---
- name: Gather existing services without changing firewall policy
  ansible.builtin.service_facts:

- name: Reject conflicting active firewalld for Calico
  ansible.builtin.assert:
    that:
      - k8s_network != 'calico' or ansible_facts['services'].get('firewalld.service', {}).get('state', 'stopped') != 'running'
    fail_msg: >-
      Calico requires removing conflicting firewalld rules. Review host security,
      apply perimeter or Calico host policies, and stop firewalld explicitly before rerunning.
