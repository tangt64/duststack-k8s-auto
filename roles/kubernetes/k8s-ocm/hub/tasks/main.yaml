---
- name: Keep legacy OCM resource deployment disabled
  ansible.builtin.assert:
    that: not (ocm_hub | default(false) | bool)
    fail_msg: This role now installs clusteradm only. Validate the OCM bundle and run clusteradm init separately; see docs/TOOLS.md.

- name: Install clusteradm from a verified external artifact
  ansible.builtin.include_role:
    name: common/cli-tool
  vars:
    cli_tool_name: clusteradm
