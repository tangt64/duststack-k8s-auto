---
- name: Keep legacy OCM registration disabled
  ansible.builtin.assert:
    that: not (ocm_spoke | default(false) | bool)
    fail_msg: This role now installs clusteradm only. Register the cluster with a reviewed short-lived join command; see docs/TOOLS.md.

- name: Install clusteradm from a verified external artifact
  ansible.builtin.include_role:
    name: common/cli-tool
  vars:
    cli_tool_name: clusteradm
